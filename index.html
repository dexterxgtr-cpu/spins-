<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#160c2b">
<meta name="mobile-web-app-capable" content="yes">
<title>Spins</title>
<style>
:root{--bg:#160c2b;--panel:#271847;--panel2:#33205c;--ink:#fff4dc;--mute:#a899c9;--gold:#ffc83d;--mint:#4fe3b0;--coral:#ff5d6c;--line:#45336f;
--c:#b7a9d6;--r:#4fb3ff;--e:#c77dff;--l:#ffc83d;--m:#ff5df2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
body{background:radial-gradient(120% 70% at 50% -10%,#52308f 0,#241346 45%,#0e0720 100%) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior:none;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
background-image:radial-gradient(1.6px 1.6px at 22px 34px,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 90px 80px,#ffd98a 50%,transparent 51%),radial-gradient(1px 1px at 150px 20px,#fff 50%,transparent 51%);background-size:170px 130px,210px 170px,130px 150px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit;width:100%;padding:15px;border-radius:14px;border:2px solid var(--line);background:#0f0820;color:var(--ink);margin-bottom:10px;-webkit-user-select:text;user-select:text}
input:focus,button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
#app.shake{animation:shake .6s}
@keyframes shake{10%,50%,90%{transform:translate(-5px,3px)}30%,70%{transform:translate(6px,-4px)}}
.auth{padding:56px 24px;text-align:center}
.logo{font-size:64px;font-weight:900;letter-spacing:4px;margin:0 0 6px;background:linear-gradient(#fff3b0,#ffc83d 55%,#d98a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px #ffc83d55)}
.auth p{color:var(--mute);margin:0 0 30px}
.btn{background:linear-gradient(#ffe27a,#ffb300);color:#3a2300;font-weight:900;padding:16px 22px;border-radius:16px;width:100%;font-size:19px;letter-spacing:1px;box-shadow:0 5px 0 #a26a00,0 10px 24px #0007;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #a26a00,0 4px 10px #0007}
.btn.alt{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 #120a24;margin-top:12px;font-size:16px}
.btn.big{font-size:24px;padding:20px 22px}
.err{color:var(--coral);min-height:22px;margin:4px 0 10px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:8px}
header b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.right{display:flex;gap:8px;align-items:center}
.right .pill{padding:6px 11px;font-size:15px}
.pill{background:linear-gradient(var(--panel2),var(--panel));border:2px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:800}
.pill span{color:var(--gold);display:inline-block}
.pill.pop span{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.5)}}
.sq{width:42px;height:42px;padding:0;font-size:20px;display:grid;place-items:center}
main{flex:1;padding:0 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:flex;gap:8px;background:#120a24ee;backdrop-filter:blur(8px);padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:2px solid var(--line);z-index:3}
nav button{flex:1;background:none;padding:8px 0;border-radius:14px;font-weight:800;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px}
nav button.on{background:var(--panel2);color:var(--gold)}
.stage{position:relative;width:min(88vw,380px);aspect-ratio:1;margin:30px auto 18px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
#wheel{inset:8%;width:84%;height:84%;border-radius:50%;will-change:transform}
.glow{position:absolute;inset:4%;border-radius:50%;box-shadow:0 0 60px 6px #ffc83d44,0 20px 50px #000a;transition:box-shadow .4s}
.pointer{position:absolute;top:-5.5%;left:50%;width:11.5%;z-index:3;transform-origin:50% 27%;filter:drop-shadow(0 4px 4px #0009)}
.odds{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:16px 0 6px}
.odds span{font-size:12px;padding:4px 9px;border-radius:99px;background:#ffffff12;font-weight:700}
.note{text-align:center;color:var(--mute);margin:8px 0 0;min-height:20px;font-size:14px}
.recent{margin-top:18px}
.recent h3{margin:0 0 8px;font-size:14px;color:var(--mute);font-weight:700}
.rrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.rit{flex:0 0 auto;width:58px;height:58px;padding:6px;border-radius:14px;background:var(--panel);display:grid;place-items:center;border-bottom:4px solid var(--c)}
.rit img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.rit.rare{border-color:var(--r)}.rit.epic{border-color:var(--e)}.rit.legendary{border-color:var(--l)}.rit.mythic{border-color:var(--m)}
.bio{color:var(--mute);font-size:13px;margin:4px 0 0;font-style:italic;max-width:280px}
.likesstat{color:var(--coral);font-weight:800}
.prof{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;color:#2a1a00;background:linear-gradient(#ffe27a,#ffa800);box-shadow:0 0 0 4px #ffffff22}
.prof h2{margin:0;font-size:20px}.prof small{color:var(--mute)}
.coll{height:8px;background:#0f0820;border-radius:9px;margin-top:8px;overflow:hidden}
.coll i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:9px}
.stats{display:flex;gap:10px;margin:0 0 14px}
.stats div{flex:1;background:var(--panel);border-radius:16px;padding:12px 6px;text-align:center;color:var(--mute);font-size:13px}
.stats b{display:block;font-size:24px;color:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{flex:0 0 auto;background:var(--panel);padding:8px 13px;border-radius:99px;font-size:13px;font-weight:700;color:var(--mute)}
.chip.on{background:var(--gold);color:#3a2300}
.chip.tog.on{background:var(--mint);color:#06281c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel2),var(--panel));border-radius:18px;padding:14px 10px 10px;text-align:center;border:2px solid var(--c)}
.card.rare{border-color:var(--r);box-shadow:0 0 14px #4fb3ff33}
.card.epic{border-color:var(--e);box-shadow:0 0 18px #c77dff55}
.card.legendary{border-color:var(--l);box-shadow:0 0 24px #ffc83d66}
.card.mythic{border-color:var(--m);box-shadow:0 0 26px #ff5df299}
.card.legendary::after,.card.epic::after,.card.mythic::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff40,transparent);animation:shine 3.2s infinite}
@keyframes shine{to{left:130%}}
.card.hid{opacity:.45}
.card .em{height:78px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 6px 6px #0008)}
.em img{max-height:100%;max-width:100%;object-fit:contain;pointer-events:none}
.card .nm{font-weight:800;margin:4px 0 0;font-size:15px}
.card .rt{font-size:12px;color:var(--mute);margin-bottom:8px}
.card>.melt{background:linear-gradient(#ff8a5c,var(--coral));color:#2a0008}
.acts{display:flex;gap:6px;position:relative;z-index:1}
.acts button{flex:1;padding:9px 4px;border-radius:11px;background:#120a24;font-size:13px;font-weight:800}
.acts .melt{background:linear-gradient(#ff8a5c,var(--coral));color:#2a0008}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:6;overflow:hidden}
.modal.show{display:flex}
.rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax;background:repeating-conic-gradient(from 0deg,var(--rc,#fff0) 0 10deg,transparent 10deg 20deg);animation:spinr 14s linear infinite;opacity:.35;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes spinr{to{transform:rotate(360deg)}}
.box{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border-radius:26px;padding:30px 38px 26px;text-align:center;border:3px solid var(--rc,#fff4);min-width:250px;box-shadow:0 0 60px var(--rc,#0000);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.box .em img{height:150px;max-width:230px}
.box .em{font-size:96px;animation:float 2s ease-in-out infinite;filter:drop-shadow(0 10px 10px #0008)}
.box h2{margin:6px 0 2px;font-size:26px}
.box .tag{display:inline-block;font-weight:900;letter-spacing:2px;color:var(--rc);margin-bottom:6px}
.box .new{position:absolute;top:-12px;right:-10px;background:var(--coral);color:#fff;font-weight:900;padding:5px 12px;border-radius:99px;transform:rotate(8deg)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes float{50%{transform:translateY(-8px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.sec{margin:0 0 22px}.sec h3{margin:0 0 4px;font-size:17px}.sec .hint{margin:0 0 10px;color:var(--mute);font-size:13px}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pk{background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center}
.pk b{display:block;font-size:26px;color:var(--gold)}.pk small{color:var(--mute)}
.price{display:inline-block;margin-top:8px;background:linear-gradient(#ffe27a,#ffb300);color:#3a2300;font-weight:900;border-radius:99px;padding:6px 12px;font-size:14px}
.poor .price{background:#4a3a6e;color:#a899c9}
.own{display:inline-block;margin-top:8px;background:var(--mint);color:#06281c;font-weight:900;border-radius:99px;padding:6px 12px;font-size:14px}
.boost{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#1f5c4a,#143a3a);border:2px solid #2f8a6f;border-radius:18px;padding:14px;text-align:left}
.boost>div{flex:1}.boost b{display:block;font-size:16px}.boost small{color:#b6f3dc}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avb{background:var(--panel);border-radius:16px;padding:10px 4px;text-align:center;border:2px solid transparent;font-size:12px;font-weight:700}
.avb.eq{border-color:var(--mint)}
.avb .av{width:48px;height:48px;font-size:22px;margin:0 auto 6px}
.rcard{border-radius:20px;padding:16px;margin-bottom:12px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--rc)}
.rtop{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.rtop b{font-size:20px;color:var(--rc)}.rtop span{font-size:34px;font-weight:900;color:var(--ink)}
.rbar{height:9px;background:#0f0820;border-radius:9px;overflow:hidden;margin-bottom:10px}.rbar i{display:block;height:100%;background:var(--rc);border-radius:9px}
.rrw{color:var(--mute);font-size:13px;margin-bottom:12px}
.rits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ri{background:#0f0820aa;border-radius:14px;padding:8px 4px;text-align:center;font-size:12px}
.ri .im{height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.ri .im img{max-height:100%;max-width:100%;object-fit:contain}
.ri.no .im{filter:grayscale(1) brightness(.5)}
.ri b{display:block;font-size:13px}.ri small{color:var(--mute)}
.lbr{display:flex;align-items:center;gap:10px;width:100%;background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px;text-align:left}
.lbr.me{border-color:var(--gold)}
.lbr .rk{width:30px;text-align:center;font-size:20px;font-weight:900;color:var(--mute)}
.lbr .av{width:44px;height:44px;font-size:20px;flex:0 0 auto}
.lbr .nn{flex:1;min-width:0}.lbr .nn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr .nn small{color:var(--mute)}
.lbr .st{text-align:right;min-width:62px}.lbr .st b{display:block;font-size:17px;color:var(--ink)}.lbr .st small{color:var(--mute);font-size:11px}
.lbr .st.on b{color:var(--gold)}
.back{background:var(--panel);padding:9px 14px;border-radius:99px;font-weight:800;font-size:14px;margin-bottom:12px}
.flash.ok{background:var(--mint);color:#06281c}
.pcard{background:linear-gradient(135deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:12px}
.ban{height:118px;background-size:cover;background-position:center}
.pbody{display:flex;align-items:flex-end;gap:12px;padding:0 16px;margin-top:-36px}
.pbody .av{width:78px;height:78px;font-size:34px;border:4px solid var(--panel2);flex:0 0 auto;background-size:cover;background-position:center}
.pinfo{flex:1;min-width:0;padding-bottom:4px}.pinfo h2{margin:0;font-size:20px}.pinfo small{color:var(--mute)}
.pcoll{padding:12px 16px 16px}
.erow{display:flex;gap:8px}.erow .btn{font-size:15px;padding:13px 10px;margin:0;letter-spacing:0}
.bns{display:flex;gap:10px;flex-wrap:wrap}.bn{width:52px;height:52px;border-radius:14px;border:3px solid transparent}.bn.on{border-color:var(--mint)}
.flash{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--coral);color:#fff;font-weight:800;padding:10px 18px;border-radius:99px;z-index:8;max-width:90vw;text-align:center;animation:pop .3s}
@media (prefers-reduced-motion:reduce){.rays,.box .em,.card::after{animation:none}#app.shake{animation:none}}
</style>
</head>

async function hash(s){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return String(h);
}

const Snd={
 ctx:null,wh:null,on:localStorage.getItem("spins_snd")!=="0",
 init(){
  if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
   const c=this.ctx=new C();this.out=c.createGain();this.out.gain.value=.85;
   const k=c.createDynamicsCompressor();this.out.connect(k);k.connect(c.destination);
   const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b}
  if(this.ctx.state==="suspended")this.ctx.resume();
 },
 ok(){return this.on&&this.ctx},
 tone(f,t,d,type="sine",v=.2,f2){
  if(!this.ok())return;const c=this.ctx,o=c.createOscillator(),g=c.createGain(),T=c.currentTime+t;
  o.type=type;o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);
  g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(v,T+.012);g.gain.exponentialRampToValueAtTime(.0001,T+d);
  o.connect(g);g.connect(this.out);o.start(T);o.stop(T+d+.05)
 },
 noise(t,d,f,v=.2,type="highpass",q=1){
  if(!this.ok())return;const c=this.ctx,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),T=c.currentTime+t;
  s.buffer=this.nb;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);
  s.connect(fl);fl.connect(g);g.connect(this.out);s.start(T,Math.random()*.5);s.stop(T+d+.02)
 },
 tick(s){const p=1+Math.random()*.1;this.noise(0,.03,2400*p,.16+.2*s,"bandpass",3);this.tone(700*p+600*s,0,.04,"triangle",.12+.1*s,260)},
 whooshStart(){
  if(!this.ok()||this.wh)return;const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=this.nb;s.loop=true;f.type="bandpass";f.frequency.value=300;f.Q.value=.8;g.gain.value=0;
  s.connect(f);f.connect(g);g.connect(this.out);s.start();this.wh={s,f,g}
 },
 whoosh(om){if(!this.wh)return;const T=this.ctx.currentTime;this.wh.g.gain.setTargetAtTime(Math.min(.22,om/9000),T,.05);this.wh.f.frequency.setTargetAtTime(250+om*1.1,T,.05)},
 whooshStop(){if(!this.wh)return;const w=this.wh;this.wh=null;w.g.gain.setTargetAtTime(0,this.ctx.currentTime,.08);setTimeout(()=>{try{w.s.stop()}catch(e){}},400)},
 sparkle(t0,n){for(let k=0;k<n;k++)this.tone(2200+Math.random()*3200,t0+k*.055+Math.random()*.03,.28,"sine",.05)},
 click(){this.tone(620,0,.05,"triangle",.1,380)},
 win(r){
  const n=(f,t,d,ty,v,f2)=>this.tone(f,t,d,ty,v,f2);
  if(r==="common"){n(523,0,.14,"triangle",.2);n(659,.1,.25,"triangle",.2)}
  else if(r==="rare"){[523,659,784,1047].forEach((f,i)=>n(f,i*.09,.32,"triangle",.22));n(262,0,.4,"sine",.2);this.sparkle(.35,7)}
  else if(r==="epic"){
   [392,494,587,784,988,1175].forEach((f,i)=>n(f,i*.08,.38,"sawtooth",.08));
   [523,659,784,1047].forEach(f=>n(f,.55,1.2,"triangle",.14));
   n(110,0,.7,"sine",.5,40);this.noise(0,.5,300,.25,"lowpass");this.sparkle(.5,14)
  }else{
   n(110,0,1.1,"sine",.7,32);this.noise(0,1.3,220,.4,"lowpass");
   [392,523,659,784,1047,1319,1568].forEach((f,i)=>{n(f,.08+i*.075,.4,"sawtooth",.07);n(f*2,.08+i*.075,.3,"triangle",.05)});
   [523,659,784,1047,1568].forEach(f=>{n(f,.7,2.2,"triangle",.13);n(f/2,.7,2.2,"sine",.1)});
   this.noise(.7,.6,3000,.12,"highpass");this.sparkle(.8,26)
  }
 },
 buy(){this.tone(784,0,.08,"square",.08);this.tone(1047,.08,.08,"square",.08);this.tone(1568,.16,.3,"square",.08);this.sparkle(.2,4)},
 melt(){
  for(let i=0;i<18;i++)this.noise(Math.random()*.7,.02+Math.random()*.04,1400+Math.random()*3500,.22,"highpass");
  this.tone(240,0,.7,"sawtooth",.05,60);this.tone(988,.7,.08,"square",.08);this.tone(1319,.78,.32,"square",.08)
 }
};

const fxc=$("#fx"),fxx=fxc.getContext("2d"),parts=[];let rainUntil=0;
function sizeFx(){fxc.width=innerWidth*devicePixelRatio;fxc.height=innerHeight*devicePixelRatio}

function burst(n,cols,x,y,power,up=1){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*power;
   parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-power*.5*up,g:.22,w:5+Math.random()*7,h:3+Math.random()*5,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:1,d:.006+Math.random()*.008,round:Math.random()<.35})}
}
function celebrate(r){
  if(REDUCE||r==="common")return;
  const st=$(".stage"),b=st?st.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0},cx=b.left+b.width/2,cy=b.top+b.height/2;
  const cols={rare:["#4fb3ff","#a5dcff","#fff"],epic:["#c77dff","#ff9bf5","#fff","#7fe3ff"],legendary:["#ffc83d","#fff3b0","#ff8a3d","#fff","#ff5d6c"]}[r];
  const n={rare:70,epic:150,legendary:260}[r];
  burst(n,cols,cx,cy,r==="legendary"?15:11);
  if(r==="legendary"){burst(90,cols,0,innerHeight*.7,16);burst(90,cols,innerWidth,innerHeight*.7,16);rainUntil=performance.now()+2200}
  if(r!=="rare"){app.classList.remove("shake");void app.offsetWidth;app.classList.add("shake")}
}
function stepFx(dt){
  const now=performance.now();
  if(now<rainUntil)burst(3,["#ffc83d","#fff","#ff8a3d"],Math.random()*innerWidth,-10,2,-.4);
  const k=devicePixelRatio;fxx.clearRect(0,0,fxc.width,fxc.height);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
   p.vy+=p.g*dt*60;p.vx*=.992;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.a+=p.va;p.life-=p.d*dt*60;
   if(p.life<=0||p.y>innerHeight+30){parts.splice(i,1);continue}
   fxx.save();fxx.translate(p.x*k,p.y*k);fxx.rotate(p.a);fxx.globalAlpha=Math.min(1,p.life*2);fxx.fillStyle=p.c;
   if(p.round){fxx.beginPath();fxx.arc(0,0,p.h*k*.7,0,7);fxx.fill()}else fxx.fillRect(-p.w*k/2,-p.h*k/2,p.w*k,p.h*k);
   fxx.restore()}
}

/* ================= WHEEL DRAWING ================= */
function drawWheel(c){
  const x=c.getContext("2d"),R=c.width/2;x.clearRect(0,0,c.width,c.height);
  ITEMS.forEach((it,i)=>{
    const a0=(i*SEG-SEG/2-90)*Math.PI/180,a1=a0+SEG*Math.PI/180;
    x.beginPath();x.moveTo(R,R);x.arc(R,R,R,a0,a1);x.closePath();x.fillStyle=it.col;x.fill();
    const g=x.createRadialGradient(R,R,R*.05,R,R,R);g.addColorStop(0,"#000a");g.addColorStop(.55,"#0003");g.addColorStop(1,"#fff2");
    x.fillStyle=g;x.fill();
    x.strokeStyle="#ffe9a655";x.lineWidth=3;x.stroke();
    x.beginPath();x.arc(R,R,R*.955,a0+.03,a1-.03);x.strokeStyle=RC[it.rar];x.lineWidth=R*.035;x.globalAlpha=.9;x.stroke();x.globalAlpha=1;
    x.save();x.translate(R,R);x.rotate(i*SEG*Math.PI/180);
    const im=IMGS[it.id];if(im&&im.naturalWidth){const sc=Math.min(R*.36/im.naturalWidth,R*.42/im.naturalHeight),w=im.naturalWidth*sc,h=im.naturalHeight*sc;x.shadowColor="#000a";x.shadowBlur=12;x.shadowOffsetY=6;x.drawImage(im,-w/2,-R*.725-h/2,w,h)}
    x.shadowColor="transparent";x.rotate(-Math.PI/2);x.textAlign="left";x.fillStyle="#fff4dc";x.font="800 "+R*.05+"px 'Trebuchet MS',sans-serif";x.fillText(it.name,R*.26,0,R*.26);
    x.restore();
  });
  for(let i=0;i<N;i++){const a=(i*SEG+SEG/2-90)*Math.PI/180,px=R+Math.cos(a)*R*.915,py=R+Math.sin(a)*R*.915;
    const g=x.createRadialGradient(px-3,py-3,1,px,py,R*.03);g.addColorStop(0,"#fff");g.addColorStop(1,"#c98500");
    x.beginPath();x.arc(px,py,R*.028,0,7);x.fillStyle=g;x.shadowColor="#0009";x.shadowBlur=6;x.fill();x.shadowBlur=0}
}
function drawFrame(t,fast){
  const c=FR,x=c.getContext("2d"),S=c.width,C=S/2;x.clearRect(0,0,S,S);
  const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,"#fff1b8");g.addColorStop(.3,"#e0a100");g.addColorStop(.55,"#fff1b8");g.addColorStop(1,"#a86f00");
  x.beginPath();x.arc(C,C,S*.455,0,7);x.strokeStyle=g;x.lineWidth=S*.07;x.stroke();
  x.beginPath();x.arc(C,C,S*.42,0,7);x.strokeStyle="#3a2200";x.lineWidth=S*.008;x.stroke();
  x.beginPath();x.arc(C,C,S*.49,0,7);x.strokeStyle="#fff6c8aa";x.lineWidth=S*.005;x.stroke();
  const nb=20,ph=Math.floor(t*(fast?16:4));
  for(let k=0;k<nb;k++){const a=k/nb*Math.PI*2,on=((k+ph)%3===0)||(winIdx!==null&&t-winT<2.2&&Math.floor(t*8)%2===0),
    bx=C+Math.cos(a)*S*.455,by=C+Math.sin(a)*S*.455;
    x.beginPath();x.arc(bx,by,S*.016,0,7);x.fillStyle=on?"#fffbe0":"#8a6a1a";x.shadowColor=on?"#ffe27a":"transparent";x.shadowBlur=on?S*.04:0;x.fill();x.shadowBlur=0}
  if(winIdx!==null){
    const pu=.5+.5*Math.sin(t*9),a0=((winIdx*SEG-SEG/2+rot)-90)*Math.PI/180,a1=a0+SEG*Math.PI/180,r=S*.42*.99;
    x.beginPath();x.moveTo(C,C);x.arc(C,C,r,a0,a1);x.closePath();x.fillStyle=`rgba(255,255,255,${.1+.2*pu})`;x.fill();
    x.strokeStyle=`rgba(255,244,200,${.6+.4*pu})`;x.lineWidth=S*.012;x.stroke();
  }
  const hg=x.createRadialGradient(C-S*.015,C-S*.02,2,C,C,S*.085);hg.addColorStop(0,"#fff6c8");hg.addColorStop(.6,"#e0a100");hg.addColorStop(1,"#7a4d00");
  x.beginPath();x.arc(C,C,S*.085,0,7);x.fillStyle=hg;x.shadowColor="#000b";x.shadowBlur=S*.03;x.fill();x.shadowBlur=0;
  x.beginPath();x.arc(C,C,S*.05,0,7);x.fillStyle="#1d1233";x.fill();
  x.fillStyle="#ffc83d";x.font=S*.06+"px serif";x.textAlign="center";x.textBaseline="middle";x.fillText("★",C,C+S*.004);
}

  const sd=$("#spds"),lb0=document.createElement("span");lb0.className="chip";lb0.style.background="none";lb0.textContent="⚙️ Speed:";sd.appendChild(lb0);
  [["chill","Chill"],["normal","Normal"],["fast","Fast"],["insane","Insane"]].forEach(([k,t])=>{const b=document.createElement("button");b.className="chip"+((a.speed||"normal")===k?" on":"");b.textContent=t;b.onclick=()=>{a.speed=k;save();Snd.click();profView();flash("Speed: "+t,true)};sd.appendChild(b)});
  const shown=ids.filter(k=>(showHidden||!a.hidden[k])&&(filt==="all"||item(k).rar===filt)),g=$("#grid");
  if(!shown.length){g.outerHTML=`<div class="empty">${ids.length?"Nothing to show with these filters.":"Your inventory is empty. Go spin the wheel!"}</div>`;return}
  shown.sort((x,y)=>ITEMS.indexOf(item(x))-ITEMS.indexOf(item(y))).forEach(k=>{
    const it=item(k),n=a.inv[k],h=a.hidden[k],d=document.createElement("div");
    d.className="card "+it.rar+(h?" hid":"");
    d.innerHTML=`<div class="em">${imgTag(it)}</div><div class="nm"></div><div class="rt"></div><div class="acts"><button class="hide"></button><button class="melt"></button></div>`;
    d.querySelector(".nm").textContent=it.name+(n>1?" ×"+n:"");
    d.querySelector(".rt").textContent=it.rar+" · "+it.melt+" spins + "+it.coin+" coins";
    d.querySelector(".hide").textContent=h?"Unhide":"Hide";
    d.querySelector(".melt").textContent=n>1?"Melt 1":"Melt";
    d.querySelector(".hide").onclick=()=>{Snd.init();Snd.click();h?delete a.hidden[k]:a.hidden[k]=true;save();profView()};
    d.querySelector(".melt").onclick=()=>melt(k,1);
    if(n>1){const b=document.createElement("button");b.textContent="Melt all ("+n+")";b.className="melt";b.style.cssText="margin-top:6px;width:100%;padding:9px;border-radius:11px;font-size:13px;font-weight:800;position:relative;z-index:1";b.onclick=()=>melt(k,n);d.appendChild(b)}

function ask(o,yes){
  $("#mbox").style.setProperty("--rc","#ff5d6c");$("#rays").style.setProperty("--rc","#fff0");
  $("#mbox").innerHTML=`<div class="em"></div><h2></h2><div class="sub" style="color:var(--mute)"></div>
  <button class="btn" style="margin-top:18px;background:linear-gradient(#ff8a5c,#ff5d6c);box-shadow:0 5px 0 #a02a36,0 10px 24px #0007;color:#2a0008" id="yes">MELT</button><button class="btn alt" id="no">Cancel</button>`;
  if(o.img)$("#mbox .em").innerHTML=`<img src="${o.img}" alt="">`;else $("#mbox .em").textContent=o.em;$("#mbox h2").textContent=o.title;$("#mbox .sub").textContent=o.sub;
  $("#modal").classList.add("show");Snd.click();
  $("#no").onclick=()=>{Snd.click();$("#modal").classList.remove("show")};
  $("#yes").onclick=()=>{$("#modal").classList.remove("show");yes()};
}
function melt(k,n,ok){
  Snd.init();const a=acc(),it=item(k);n=Math.min(n,a.inv[k]||0);if(!n)return;
  if(it.rar!=="common"&&!ok){ask({img:IM[it.id],title:`Melt ${n} × ${it.name}?`,sub:`You get ${n*it.melt} spins + ${n*it.coin} coins`},()=>melt(k,n,true));return}
  a.inv[k]-=n;if(a.inv[k]<=0){delete a.inv[k];delete a.hidden[k]}
  a.spins+=n*it.melt;a.coins+=n*it.coin;a.stats.melted+=n;save();Snd.melt();vib([30,20,30]);render();setSpins();
  const st=$(".stats");burst(40,["#ff8a5c","#ffc83d","#fff"],innerWidth/2,innerHeight*.45,8);
  popup({em:"🔥",name:"+"+n*it.melt+" spins  +"+n*it.coin+" 🪙",sub:"Melted "+n+" × "+it.name,rar:"epic",tag:"MELTED"});
}

  const mk=$("#mk");

  <div class="bar" style="display:flex;justify-content:space-between;color:var(--mute);margin:6px 0 10px"><b style="color:var(--ink)">Inventory</b><span></span></div><div class="grid" id="grid"></div>`;

    el.innerHTML=`<div class="em">${imgTag(it)}</div><div class="nm"></div><div class="rt"></div>`;

/* ================= MAIN LOOP: physics, ticks, pointer, bulbs ================= */
let last=performance.now(),pa=0,pv=0,bulbT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;let om=0;
  if(spinState&&WH){
    const s=spinState,el=now-s.t0;let ang;
    if(el<s.PULL){const p=el/s.PULL;ang=s.from+(s.start-s.from)*(1-Math.pow(1-p,2))}
    else{const p=Math.min(1,(el-s.PULL)/s.DUR);ang=s.start+(s.to-s.start)*easeQ(p);if(p>=1){rot=s.to;WH.style.transform=`rotate(${rot}deg)`;finishSpin();ang=null}}
    if(ang!==null){
      om=Math.abs(ang-s.prev)/Math.max(dt,.001);s.prev=ang;rot=ang;WH.style.transform=`rotate(${ang}deg)`;
      const k=Math.floor((ang+SEG/2)/SEG);
      if(k!==s.k){const sp=Math.min(1,om/1500);s.k=k;Snd.tick(sp);pv+=-420*(.4+sp);if(now-s.lastTick>70){vib(6);s.lastTick=now}}
      Snd.whoosh(om);
    }
  }
  /* pointer spring: kicked by pegs, springs back */
  pv+=(-pa*520-pv*16)*dt;pa+=pv*dt;pa=Math.max(-38,Math.min(12,pa));
  if(PT)PT.style.transform=`translateX(-50%) rotate(${pa}deg)`;
  if(FR){bulbT+=dt;drawFrame(bulbT,spinning)}
  stepFx(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
